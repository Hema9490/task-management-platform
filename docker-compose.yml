version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=change-me-in-production
    volumes:
      - backend_instance:/app/instance

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000
    ports:
      - "4173:80"
    depends_on:
      - backend

volumes:
  backend_instance:
